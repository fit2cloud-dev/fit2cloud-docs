# 构建 Docusaurus 站点并部署到阿里云 OSS(CDN 前置)
#
# 触发: push 到 main 且站点内容变化时自动部署; 也可 workflow_dispatch 手动触发。
#
# 需要的 GitHub Secrets(仓库 Settings -> Secrets and variables -> Actions):
#   ALIYUN_ACCESS_KEY_ID       阿里云 AccessKey ID
#   ALIYUN_ACCESS_KEY_SECRET   阿里云 AccessKey Secret
#   ALIYUN_OSS_ENDPOINT         OSS 外网 Endpoint, 如 oss-cn-hangzhou.aliyuncs.com
#   ALIYUN_OSS_BUCKET           OSS Bucket 名称, 如 my-docs
#   ALIYUN_CDN_DOMAIN           CDN 加速域名, 如 docs.fit2cloud.com
#
# 流程:
#   1. npm run build 生成静态站点到 build/
#   2. 用 ossutil sync 全量同步到 Bucket(--delete 清理本地已删除的文件)
#   3. 用 aliyun-cli 调用 CDN RefreshObjectCaches 目录刷新, 强制全站清缓存

name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]
    paths:
      - 'docusaurus.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'sidebars.js'
      - 'docs/**'
      - 'src/**'
      - 'static/**'
      - '*-docs/**'
      - 'i18n/**'
      - '.github/workflows/deploy-oss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oss
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to OSS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Download ossutil
        run: |
          curl -sSfL -o ossutil.zip \
            https://gosspublic.alicdn.com/ossutil/v2/2.4.0/ossutil-2.4.0-linux-amd64.zip
          unzip -o ossutil.zip -d ossutil-bin
          find ossutil-bin -name ossutil -type f -exec chmod +x {} \;
          # 复制到工作区根目录并加入 PATH
          find ossutil-bin -name ossutil -type f -exec cp {} ./ossutil \;
          chmod +x ./ossutil

      - name: Sync build to OSS (incremental sync)
        run: |
          # 每次 npm run build 都会刷新所有文件的 mtime, 若按时间戳(--update)判断
          # 会把"内容没变仅时间变"的文件也当作要传, 导致每次全量上传(约 400MB), 很慢。
          # 因此改用 --size-only 按文件大小判断: 大小相同即视为未变化、跳过, 只传真正有改动的文件。
          # Docusaurus 静态资源带内容哈希, 内容变了文件名/大小必变, 必会正确上传。
          # 保留 --delete 让本地删除的文件也能从云端同步删除(两端一致)。
          # --size-only 是增量关键: 只比文件大小, 大小相同即跳过, 避免每次全量上传。
          # ossutil v2 默认 SigV4 签名, 必须用下面的 region 推导(缺少会报 "region must be set")。
          # region 从 endpoint 推导: 如 oss-cn-hangzhou.aliyuncs.com -> cn-hangzhou
          OSS_REGION="$(echo "$ALIYUN_OSS_ENDPOINT" | sed -E 's|^https?://||; s|^oss-||; s|\..*||')"
          echo "Derived region: $OSS_REGION"
          cat > "$HOME/.ossutilconfig" <<EOF
          [default]
          accessKeyID = "$ALIYUN_ACCESS_KEY_ID"
          accessKeySecret = "$ALIYUN_ACCESS_KEY_SECRET"
          region = "$OSS_REGION"
          endpoint = "$ALIYUN_OSS_ENDPOINT"
          EOF
          ./ossutil sync ./build/ "oss://$ALIYUN_OSS_BUCKET/" --delete --size-only -f
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}

      # --- CDN 缓存刷新(暂时停用, 后续再启用) ---
