# 多产品更新日志自动生成并提 PR（dataease / 1panel / cordys / ai-gateway / maxkb / sqlbot）
#
# 与 auto-changelog.yml（JumpServer 专用）相互独立：
#   - 产品清单与格式规则由 .github/scripts/gen_changelog_multi.py 的 PRODUCTS 配置驱动，
#     脚本 `--matrix` 输出当前启用的产品，本 workflow 据此动态生成 matrix。
#   - 目标文件按主版本号路由（见脚本 targets 配置）。
#   - 数据源按产品区分：多数走社区发布 API，ai-gateway 走 GitHub Releases
#     （脚本内 fetch_releases 自动分派，本 workflow 无需感知）。
#   - 每个产品一个独立 job，各自创建 PR，互不干扰；版本已存在时脚本会自动跳过。
#     跳过时脚本多输出一行 STATUS=skipped，本 workflow 据此打 ::notice、在 Step Summary
#     里标注「已跳过」，并跳过创建 PR 的步骤——避免「机器人天天绿、却从未开过 PR」的静默失效。
#
# 注意:
#   - schedule 触发器只在仓库默认分支(main)上生效；放在功能分支上时，
#     只能用 workflow_dispatch 手动运行（Actions 页面选择本分支后 Run workflow）。
#   - 需要仓库 Settings -> Actions -> General -> Workflow permissions 设为
#     "Read and write permissions"，否则最后一步创建 PR 会 403。
#   - 脚本退出码 3 表示版本与目标文件不匹配（sanity check），通常是新大版本做快照后
#     脚本的 targets 配置未同步更新，此时不会生成 PR，需人工修正后重跑。

name: Auto Changelog (Multi-product)

on:
  workflow_dispatch:
    inputs:
      product:
        description: '仅运行指定产品(dataease/1panel/cordys/ai-gateway/maxkb/sqlbot，逗号分隔)；留空则运行全部'
        required: false
        default: ''
      version:
        description: '指定版本号(如 v3.1.0)；留空则各产品自动取发布源的最新版本'
        required: false
        default: ''
  schedule:
    # 每日 20:10 UTC（北京时间次日 04:10），与 JumpServer 的 20:05 错开
    - cron: '10 20 * * *'

permissions:
  contents: write
  pull-requests: write

env:
  BASE_BRANCH: main
  SCRIPT: .github/scripts/gen_changelog_multi.py
  # ai-gateway 的数据源是 GitHub Releases API；带上 token 可避免匿名调用限流
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      products: ${{ steps.resolve.outputs.products }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve product matrix
        id: resolve
        run: |
          set -e
          products=$(python "${SCRIPT}" --matrix "${{ github.event.inputs.product }}")
          echo "Products: ${products}"
          echo "products=${products}" >> "$GITHUB_OUTPUT"

  changelog:
    needs: list
    if: ${{ needs.list.outputs.products != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJson(needs.list.outputs.products) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Detect version and target file
        id: detect
        run: |
          set -e
          version=$(python "${SCRIPT}" "${{ matrix.product }}" ${{ github.event.inputs.version }} --print-version)
          echo "Raw version: ${version}"
          if [ -z "${version}" ] || [ "${version}" = "null" ]; then
            echo "No version detected for ${{ matrix.product }} (API error / empty list?), aborting."
            exit 1
          fi
          target_file=$(python "${SCRIPT}" "${{ matrix.product }}" "${version}" --print-target)
          source=$(python "${SCRIPT}" "${{ matrix.product }}" --print-source)
          echo "Version: ${version}"
          echo "Target file: ${target_file}"
          echo "Source: ${source}"
          {
            echo "version=${version}"
            echo "target_file=${target_file}"
            echo "source=${source}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog entry
        id: generate
        run: |
          set -e
          # 退出码 0 同时覆盖「已生成」和「版本已存在、跳过」两种情况，必须靠 STATUS 标记区分，
          # 否则跳过会被当成成功，没人会发现 PR 其实从来没建出来。
          out=$(python "${SCRIPT}" "${{ matrix.product }}" "${{ steps.detect.outputs.version }}")
          printf '%s\n' "${out}"
          status=$(printf '%s\n' "${out}" | sed -n 's/^STATUS=//p' | tail -n 1)
          echo "status=${status:-generated}" >> "$GITHUB_OUTPUT"
          if [ "${status}" = "skipped" ]; then
            echo "::notice title=${{ matrix.product }} 跳过::${{ matrix.product }} ${{ steps.detect.outputs.version }} 已存在于 ${{ steps.detect.outputs.target_file }}，本次未生成内容，也不会创建 PR。"
          fi
          echo "----- preview (first 30 lines) -----"
          head -n 30 "${{ steps.detect.outputs.target_file }}"
          echo "------------------------------------"

      - name: Create Pull Request
        if: steps.generate.outputs.status != 'skipped'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/changelog-${{ matrix.product }}
          base: ${{ env.BASE_BRANCH }}
          title: "chore(changelog): ${{ matrix.product }} ${{ steps.detect.outputs.version }}"
          commit-message: "chore(changelog): ${{ matrix.product }} ${{ steps.detect.outputs.version }}"
          body: |
            自动生成的更新日志条目：**${{ matrix.product }} ${{ steps.detect.outputs.version }}**

            - 数据来源：${{ steps.detect.outputs.source }}
            - 目标文件：`${{ steps.detect.outputs.target_file }}`
            - 基础分支：`${{ env.BASE_BRANCH }}`

            内容由 `gen_changelog_multi.py` 从发布说明生成，合并前请人工核对措辞与分类。
          delete-branch: true

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.generate.outputs.status }}" = "skipped" ]; then
            {
              echo "### Auto Changelog - ${{ matrix.product }}"
              echo ""
              echo "- 版本: \`${{ steps.detect.outputs.version || '(未检测到)' }}\`"
              echo "- 状态: 已跳过（版本已存在于 \`${{ steps.detect.outputs.target_file }}\`，未创建 PR）"
              echo ""
              echo "跳过通常意味着更新日志已被人工提前提交。如需核对机器人生成的内容，可本地执行"
              echo "\`python ${SCRIPT} ${{ matrix.product }} ${{ steps.detect.outputs.version }} --force --dry-run\` 后与文档比对。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Auto Changelog - ${{ matrix.product }}"
              echo ""
              echo "- 版本: \`${{ steps.detect.outputs.version || '(未检测到)' }}\`"
              echo "- 目标文件: \`${{ steps.detect.outputs.target_file || '-' }}\`"
              echo "- 状态: 已生成，等待创建 PR"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
